name: Gitea Runner
description: Runs the Actions workflows of your Gitea inside an isolated app, without access to your Home Assistant host.
version: "1.0.0-dev2"
slug: gitea_runner
stage: experimental
init: false
arch:
  - amd64
  - aarch64
url: https://github.com/seb5594/Home-Assistant-Gitea-Runner-App
ingress: true
ingress_port: 8099
panel_icon: mdi:play-box-multiple
panel_title: Gitea Runner
# Caches and job workspaces would only bloat the backups; the runner registration stays in them.
backup_exclude:
  - /data/cache
  - /data/work
  - /data/home
options:
  gitea_url: "http://db21ed7f-gitea:3000"
  registration_token: ""
  runner_name: ""
  labels:
    - home-assistant
  capacity: 1
  advanced:
    ignore_certificate_errors: false
    debug_logging: false
schema:
  gitea_url: str?
  registration_token: password?
  runner_name: str?
  labels:
    - str
  capacity: int(1,4)
  advanced:
    ignore_certificate_errors: bool
    debug_logging: bool
