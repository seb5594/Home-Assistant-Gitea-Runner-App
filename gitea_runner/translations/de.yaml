configuration:
  gitea_url:
    name: Gitea-Adresse
    description: Adresse deines Gitea. Standard ist die Gitea-App von alexbelgium. Für eine andere App http://<Hostname>:3000, für ein Gitea an anderer Stelle zum Beispiel https://git.example.com.
  registration_token:
    name: Registrierungstoken
    description: Von der Runner-Seite in Gitea kopieren (Website-Administration, eine Organisation oder ein Repository, siehe App-Seite). Wird einmal gebraucht; die Registrierung bleibt erhalten, du kannst das Feld danach leeren. Trage einen neuen Token ein und starte die App neu, um erneut zu registrieren.
  runner_name:
    name: Runner-Name
    description: Wie der Runner in Gitea heißt. Leer lassen für "home-assistant".
  labels:
    name: Labels
    description: Die Namen, die ein Workflow bei "runs-on" einträgt, um auf diesem Runner zu laufen. Jobs laufen in dieser App.
  capacity:
    name: Parallele Jobs
    description: Wie viele Jobs gleichzeitig laufen. Jeder Job braucht Arbeitsspeicher und CPU; auf einem Raspberry Pi bei 1 bleiben.
  advanced:
    name: Erweitert
    description: Wird nur für ein selbstsigniertes Gitea-Zertifikat und zur Fehlersuche gebraucht.
    fields:
      ignore_certificate_errors:
        name: Zertifikatsfehler ignorieren
        description: Akzeptiert jedes Zertifikat von Gitea. Nur für ein Gitea im eigenen Netzwerk, dem du kein vertrauenswürdiges Zertifikat geben kannst.
      debug_logging:
        name: Debug-Protokoll
        description: Protokolliert deutlich mehr Details, auch was der Runner mit Gitea austauscht. Nach der Fehlersuche wieder ausschalten.
