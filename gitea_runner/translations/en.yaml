configuration:
  gitea_url:
    name: Gitea address
    description: Address of your Gitea. The default is the Gitea app by alexbelgium. For another app use http://<host name>:3000, for a Gitea elsewhere for example https://git.example.com.
  registration_token:
    name: Registration token
    description: Copy it from the runners page of Gitea (Site administration, an organization or a repository, see the app page). Needed once; the registration is kept, so you can empty this field afterwards. Enter a new token and restart the app to register again.
  runner_name:
    name: Runner name
    description: How the runner is called in Gitea. Leave empty for "home-assistant".
  labels:
    name: Labels
    description: The names a workflow puts in "runs-on" to run on this runner. Jobs run inside this app.
  capacity:
    name: Parallel jobs
    description: How many jobs run at the same time. Every job needs memory and CPU; on a Raspberry Pi keep it at 1.
  advanced:
    name: Advanced
    description: Only needed for a self-signed Gitea certificate and for troubleshooting.
    fields:
      cpu_cores:
        name: CPU cores for jobs
        description: How many CPU cores all jobs together may use. The rest stays free for Home Assistant. The default of 1 keeps Home Assistant responsive while a job compiles or tests; on a device with one core the setting has no effect.
      ignore_certificate_errors:
        name: Ignore certificate errors
        description: Accepts any certificate of Gitea. Only for a Gitea in your own network that you cannot give a trusted certificate.
      debug_logging:
        name: Debug logging
        description: Logs much more detail, including what the runner exchanges with Gitea. Switch it off again after troubleshooting.
