<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gitea Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Gitea Runner</h1>
      <span id="release" class="pill" hidden></span>
      <button id="recheck" type="button"></button>
    </header>
    <p id="checked" class="muted"></p>
    <section id="problems" class="banner bad" hidden></section>
    <nav id="tabs" role="tablist"></nav>
    <div id="panels"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
